<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>feature graphic</title>
<style>
  html, body { margin: 0; padding: 0; background: #12352a; }
  /* Rendered at the exact 1024x500 Play requires, centred so a centred crop lands on it. */
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; }

  .canvas {
    width: 1024px; height: 500px;
    background: #0f3d2e;
    position: relative; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 71px 76px; box-sizing: border-box;
  }
  .rule { width: 86px; height: 8px; background: #f5a524; border-radius: 4px; margin: 0 0 28px; }
  h1 {
    margin: 0; color: #fff; font-size: 100px; font-weight: 700;
    letter-spacing: -3.2px; line-height: 1;
  }
  p {
    margin: 22px 0 0; color: rgba(255,255,255,0.74);
    font-size: 33px; font-weight: 450; line-height: 1.4; width: 800px;
    letter-spacing: -0.3px;
  }

  /* The app's own phase timeline, reduced to its skeleton: reached, current, ahead. */
  .spine { position: absolute; left: 71px; right: 71px; bottom: 52px; height: 2px; background: rgba(255,255,255,0.14); }
  .node {
    position: absolute; bottom: 44px; width: 19px; height: 19px; border-radius: 50%;
    background: #2aa870;
  }
  .node.now { background: #f5a524; box-shadow: 0 0 0 8px rgba(245,165,36,0.22); }
  .node.dim { background: rgba(255,255,255,0.2); }
</style>
</head>
<body>
  <div class="canvas">
    <div class="rule"></div>
    <h1>Smoke Free</h1>
    <p>Sourced recovery milestones, and honest about slips.<br>Nothing ever leaves your phone.</p>

    <div class="spine"></div>
    <div class="node"     style="left: 71px;"></div>
    <div class="node"     style="left: 202px;"></div>
    <div class="node"     style="left: 333px;"></div>
    <div class="node now" style="left: 468px;"></div>
    <div class="node dim" style="left: 644px;"></div>
    <div class="node dim" style="left: 819px;"></div>
  </div>
</body>
</html>
